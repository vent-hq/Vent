app = "vent-worker"
primary_region = "iad"
# Wait up to 5m (Fly's hard cap) for in-flight voice calls to drain on deploy.
# Calls still running 3m after SIGTERM are cancelled so they hang up and report
# before this (apps/worker/src/index.ts); a killed call fails cleanly rather
# than being replayed (maxStalledCount: 0 in src/index.ts).
kill_timeout = "5m"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  WORKER_TOTAL_CONCURRENCY = "2"
  API_URL = "http://vent-api.internal:3000"
  API_PUBLIC_URL = "https://api.venthq.dev"
  WORKER_METRICS_PORT = "9091"

# The worker takes no inbound traffic; Fly checks the metrics server instead.
[checks.health]
  type = "http"
  port = 9091
  path = "/health"
  method = "get"
  grace_period = "15s"
  interval = "30s"
  timeout = "5s"

[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
