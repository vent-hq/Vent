# Start dependencies: docker compose -f compose.local.yaml up -d --wait
# Start Vent's API and worker in Docker: doppler run --project vent --config dev -- pnpm dev:docker
# Stop:  docker compose -f compose.local.yaml down
# Local data survives stopping; `down --volumes` resets it.
# Credentials below are for this isolated local environment only.
name: vent-nassau-local

# Host settings for database setup and CLI requests; container addresses override these below.
x-local-environment: &local-environment
  NODE_ENV: development
  DATABASE_URL: postgres://vent:vent_local@127.0.0.1:${VENT_LOCAL_POSTGRES_PORT:-15432}/vent_local
  REDIS_URL: redis://127.0.0.1:${VENT_LOCAL_REDIS_PORT:-16379}
  S3_ENDPOINT: http://127.0.0.1:${VENT_LOCAL_STORAGE_PORT:-18333}
  S3_BUCKET: vent-local
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: vent-local
  S3_SECRET_ACCESS_KEY: vent-local-storage-secret
  API_HOST: 127.0.0.1
  API_PORT: "${VENT_LOCAL_API_PORT:-3001}"
  API_URL: http://127.0.0.1:${VENT_LOCAL_API_PORT:-3001}
  API_PUBLIC_URL: http://127.0.0.1:${VENT_LOCAL_API_PORT:-3001}
  VENT_REFRESH_TOKEN: vent_010101010101010101010101010101010101010101010101
  DASHBOARD_URL: http://localhost:3000
  RUNNER_CALLBACK_SECRET: vent-local-callback-secret
  PLATFORM_CONNECTIONS_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  WORKER_METRICS_PORT: "${VENT_LOCAL_METRICS_PORT:-19091}"
  WORKER_TOTAL_CONCURRENCY: "45"
  FLEET_MAX_ACTIVE_RUNS: "45"

x-container-environment: &container-environment
  <<: *local-environment
  DATABASE_URL: postgres://vent:vent_local@postgres:5432/vent_local
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://storage:8333
  API_HOST: 0.0.0.0
  API_PORT: "3000"
  API_URL: http://api:3000
  WORKER_METRICS_PORT: "9091"

services:
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *container-environment
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:${VENT_LOCAL_API_PORT:-3001}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    profiles: [app]
    image: vent-nassau-local-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *container-environment
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vent
      POSTGRES_PASSWORD: vent_local
      POSTGRES_DB: vent_local
    ports:
      - "127.0.0.1:${VENT_LOCAL_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vent -d vent_local"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${VENT_LOCAL_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # SeaweedFS 4.50, pinned to the multi-platform image used for verification.
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: ["mini", "-dir=/data", "-ip=storage"]
    environment:
      AWS_ACCESS_KEY_ID: vent-local
      AWS_SECRET_ACCESS_KEY: vent-local-storage-secret
      S3_BUCKET: vent-local
    ports:
      - "127.0.0.1:${VENT_LOCAL_STORAGE_PORT:-18333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  storage-data:
