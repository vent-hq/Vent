app = "vent-redis"
primary_region = "iad"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "redis_data"
  destination = "/data"

[checks.redis]
  type = "tcp"
  port = 6379
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
